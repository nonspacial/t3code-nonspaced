[package]
name = "spike"
version = "0.1.0"
edition = "2024"

[dependencies]
gstreamer = "0.25.4"
gstreamer-allocators = { version = "0.25.4", features = ["v1_24"] }
gstreamer-app = "0.25.2"
gstreamer-video = { version = "0.25.4", features = ["v1_24"] }
libc = "0.2.191"
memmap2 = "0.9.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
