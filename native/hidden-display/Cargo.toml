[package]
name = "t3-hidden-display"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gstreamer = "0.25.4"
gstreamer-allocators = { version = "0.25.4", features = ["v1_24"] }
gstreamer-app = "0.25.2"
gstreamer-video = { version = "0.25.4", features = ["v1_24"] }
libc = "0.2.191"
memmap2 = "0.9.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8.0", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
